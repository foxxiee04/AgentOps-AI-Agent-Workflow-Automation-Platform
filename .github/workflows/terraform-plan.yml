# Terraform plan on pull requests.
#
# Whenever a change lands under `infrastructure/terraform/**` (or touches these
# workflows) this runs the offline Terraform checks and posts one plan comment
# per environment (dev, prod) on the pull request. AWS access uses GitHub OIDC
# with a read-only plan role - no static credentials are stored.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION                  AWS region of the remote state bucket.
#   TF_STATE_BUCKET             S3 bucket holding Terraform state (bootstrap output).
#   TF_LOCK_TABLE               DynamoDB table used for state locking.
#   TF_VARS_DEV                 Multiline contents of environments/dev/<env>.tfvars.
#   TF_VARS_PROD                Multiline contents of environments/prod/<env>.tfvars.
#   AWS_TF_PLAN_ROLE_ARN_DEV    READ-ONLY role assumed to plan the dev environment.
#   AWS_TF_PLAN_ROLE_ARN_PROD   READ-ONLY role assumed to plan the prod environment.
#
# Required files in the repository:
#   infrastructure/terraform/.tflint.hcl and each environment Terraform root.

name: Terraform plan

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (${{ matrix.environment }})
    # Needs the remote state bucket; skipped while the stack uses local state.
    if: vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - prod
        include:
          - environment: dev
            plan_role_var: AWS_TF_PLAN_ROLE_ARN_DEV
            tfvars_var: TF_VARS_DEV
          - environment: prod
            plan_role_var: AWS_TF_PLAN_ROLE_ARN_PROD
            tfvars_var: TF_VARS_PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Init tflint
        run: tflint --init --config="$GITHUB_WORKSPACE/infrastructure/terraform/.tflint.hcl"

      - name: Terraform lint
        id: tflint
        run: >-
          tflint
          --config="$GITHUB_WORKSPACE/infrastructure/terraform/.tflint.hcl"
          --chdir=infrastructure/terraform/environments/${{ matrix.environment }}
          --call-module-type=all

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.plan_role_var] }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write backend config
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "agentops/${{ matrix.environment }}/terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_LOCK_TABLE}"
          encrypt        = true
          EOF

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform validate
        id: validate
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Write tfvars
        env:
          TFVARS: ${{ vars[matrix.tfvars_var] }}
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: printf '%s\n' "$TFVARS" > ${{ matrix.environment }}.tfvars

      - name: Terraform plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: >-
          terraform plan -input=false -no-color -lock=false
          -var-file=${{ matrix.environment }}.tfvars -out=tfplan

      - name: Render plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment plan
        if: always()
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.environment }}
          FMT_RESULT: ${{ steps.fmt.outcome }}
          TFLINT_RESULT: ${{ steps.tflint.outcome }}
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
          PLAN_FILE: infrastructure/terraform/environments/${{ matrix.environment }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const environment = process.env.ENV_NAME;
            const marker = `<!-- terraform-plan-${environment} -->`;
            const checks = [
              '| Check | Result |',
              '| --- | --- |',
              `| \`terraform fmt -check\` | ${process.env.FMT_RESULT || 'skipped'} |`,
              `| \`tflint\` | ${process.env.TFLINT_RESULT || 'skipped'} |`,
              `| \`terraform validate\` | ${process.env.VALIDATE_RESULT || 'skipped'} |`,
            ].join('\n');
            let plan;
            try {
              plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            } catch (error) {
              plan = `(no plan output available: ${error.message})`;
            }
            const limit = 60000;
            const truncated = plan.length > limit;
            const shown = truncated ? plan.slice(0, limit) : plan;
            const body = [
              marker,
              `## Terraform plan: \`${environment}\``,
              '',
              checks,
              '',
              '```diff',
              shown,
              '```',
              ...(truncated ? ['', `_Plan truncated at ${limit} characters._`] : []),
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
