name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Evaluate lead golden set
        run: pnpm eval:leads

  integration:
    name: Integration
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration

  e2e:
    name: E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start stack
        timeout-minutes: 15
        env:
          COMPOSE_BAKE: "false"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
          # The one-shot `setup` service (migrate + seed) exits, so poll the apps instead of using --wait.
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health/ready >/dev/null && curl -fsS http://localhost:3000/en >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 10
          done
          echo "stack did not become ready in 10 minutes" >&2
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter @agentops/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          CI: "true"
        run: pnpm --filter @agentops/web exec playwright test --reporter=line,html

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml logs --tail=200 api web workflow-worker ai-worker tool-worker notification-worker

      - name: Teardown stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml down -v

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra:
    name: Infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workflows and deploy script
        run: pnpm ci:lint

      - name: Lint Dockerfiles
        run: pnpm docker:lint

      - name: Validate Kubernetes manifests
        run: pnpm k8s:validate

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          # validate.mjs parses `terraform show -json`; the wrapper would add extra stdout lines.
          terraform_wrapper: false

      - name: Validate Terraform
        run: pnpm tf:validate

  images:
    name: Image (${{ matrix.app }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - api
          - web
          - workflow-worker
          - ai-worker
          - tool-worker
          - notification-worker
        include:
          - app: api
            dockerfile: infrastructure/docker/api.Dockerfile
            build-args: ""
          - app: web
            dockerfile: infrastructure/docker/web.Dockerfile
            build-args: ""
          - app: workflow-worker
            dockerfile: infrastructure/docker/worker.Dockerfile
            build-args: WORKER_PACKAGE=@agentops/workflow-worker
          - app: ai-worker
            dockerfile: infrastructure/docker/worker.Dockerfile
            build-args: WORKER_PACKAGE=@agentops/ai-worker
          - app: tool-worker
            dockerfile: infrastructure/docker/worker.Dockerfile
            build-args: WORKER_PACKAGE=@agentops/tool-worker
          - app: notification-worker
            dockerfile: infrastructure/docker/worker.Dockerfile
            build-args: WORKER_PACKAGE=@agentops/notification-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          load: true
          push: false
          tags: agentops/${{ matrix.app }}:pr-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Scan image with Trivy
        # Pinned to the v0.36.0 commit: the old unprefixed tags were removed upstream.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentops/${{ matrix.app }}:pr-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
