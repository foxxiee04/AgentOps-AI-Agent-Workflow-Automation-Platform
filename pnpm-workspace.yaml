packages:
  - "apps/*"
  - "packages/*"
overrides:
  '@grpc/grpc-js': ^1.14.5
  '@opentelemetry/propagator-jaeger': ^2.9.0
  body-parser: ^2.4.0
  fast-uri: ^3.1.7
  multer: ^2.5.0
  proxy-addr: ^2.0.8
  zod: ^4.6.6
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.2'
  - '@types/react@19.2.17'
storeDir: ./.pnpm-store
