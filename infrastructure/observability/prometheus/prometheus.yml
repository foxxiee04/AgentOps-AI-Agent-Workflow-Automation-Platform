global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: agentops-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4000
        labels:
          service: api

  - job_name: agentops-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4101
        labels:
          service: workflow-worker
      - targets:
          - host.docker.internal:4102
        labels:
          service: ai-worker
      - targets:
          - host.docker.internal:4103
        labels:
          service: tool-worker
      - targets:
          - host.docker.internal:4104
        labels:
          service: notification-worker

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
