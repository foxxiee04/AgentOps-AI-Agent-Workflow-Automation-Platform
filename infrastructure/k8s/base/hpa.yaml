# HPA per Deployment. Kafka topics have 3 partitions, so worker replicas beyond
# 3 stay idle (a partition is consumed by only one consumer in a group) - maxReplicas
# is capped at 3 to match the partition count. Prod replaces the worker HPAs with KEDA
# (components/keda-autoscaling) and raises partitions to 6.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentops-api
  namespace: agentops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentops-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
