apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-api
  namespace: agentops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-api
  template:
    metadata:
      labels:
        app: agentops-api
    spec:
      containers:
        - name: api
          image: agentops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: agentops-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-api
  namespace: agentops
spec:
  selector:
    app: agentops-api
  ports:
    - port: 4000
      targetPort: 4000
---
