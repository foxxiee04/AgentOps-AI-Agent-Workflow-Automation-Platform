apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentops

labels:
  - pairs:
      app.kubernetes.io/part-of: agentops
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - api.yaml
  - web.yaml
  - workers.yaml
  - hpa.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - external-secret.yaml
