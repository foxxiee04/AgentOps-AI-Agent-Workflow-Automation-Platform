apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentops-secrets
  namespace: agentops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentops-secrets-store
  target:
    name: agentops-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Overlays patch this key per environment.
        # The referenced secret is expected to contain the keys:
        # DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
        # OPENAI_API_KEY, POSTGRES_PASSWORD.
        key: agentops/app
