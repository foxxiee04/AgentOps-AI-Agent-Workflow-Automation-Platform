global:
  resolve_timeout: 5m

route:
  receiver: agentops-alert-bot
  group_by:
    - alertname
    - service
    - severity
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: agentops-alert-bot
    webhook_configs:
      - url: http://agentops-api.agentops:4000/notifications/alertmanager
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            # Secret `alertmanager-webhook` (key `token`) must match the API's
            # ALERTMANAGER_WEBHOOK_TOKEN.
            credentials_file: /etc/alertmanager/webhook/token

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - service
