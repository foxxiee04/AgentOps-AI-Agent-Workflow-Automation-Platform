apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: agentops-secrets-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          # IRSA role from Terraform.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
